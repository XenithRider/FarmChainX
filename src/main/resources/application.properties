spring.application.name=farmchain

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/farmchain
spring.datasource.username=root
spring.datasource.password=@Sumit

#JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# PORT configuration
server.port=8080

# increase file upload size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
frontend.url=https://farmchainx.com

app.spa.enabled=true

# src/main/resources/application.properties

spring.mvc.pathmatch.matching-strategy=ant_path_matcher


logging.level.com.farmchain.farmchain=DEBUG
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG

